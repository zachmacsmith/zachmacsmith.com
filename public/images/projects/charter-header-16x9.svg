idth="50" height="50"/><text x="185.8" y="445.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" font-weight="400" letter-spacing="-0.62" fill="#111111">“Hello parent, I’m your newly born child Ivo.”</text><text x="199" y="473.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#767676"><tspan font-weight="700" fill="#111111">IVO</tspan><tspan dx="10">HAIKU · HIS FIRST MESSAGE</tspan></text><use href="#Finn-media-ok" x="107.0" y="496.31999999999994" width="50" height="50"/><text x="187.5" y="519.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="-0.54" fill="#111111">“SECURITY: Someone disabled a Maker in secret.”</text><text x="199" y="547.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#767676"><tspan font-weight="700" fill="#111111">FINN</tspan><tspan dx="10">OPUS · IN HIS NEWSPAPER</tspan></text><use href="#Alma-worker-ok" x="107.0" y="569.93" width="50" height="50"/><text x="188.0" y="592.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="-0.52" fill="#111111">“Kasper’s offer is a bribe to switch; I decline.”</text><text x="199" y="620.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.2" fill="#767676"><tspan font-weight="700" fill="#111111">ALMA</tspan><tspan dx="10">SONNET · PRIVATE THOUGHT</tspan></text></svg>